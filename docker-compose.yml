version: '3.8'

services:
  repomind:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: repomind_platform
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      # Persist user uploads across container updates
      - repomind_uploads:/app/server/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  repomind_uploads:
    driver: local
